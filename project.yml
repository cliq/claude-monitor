name: ClaudeMonitor
options:
  bundleIdPrefix: com.cliqconsulting.claudemonitor
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "17"
    # Default off for fast local iteration (no TCC prompts when driving Terminal).
    # The release workflow overrides this to YES for notarization.
    ENABLE_HARDENED_RUNTIME: NO
schemes:
  ClaudeMonitor:
    build:
      targets:
        ClaudeMonitor: all
        ClaudeMonitorWidget: [build]
        ClaudeMonitorTests: [test]
        ClaudeMonitorIntegrationTests: [test]
        ClaudeMonitorUITests: [test]
    test:
      targets:
        - ClaudeMonitorTests
        - ClaudeMonitorIntegrationTests
        - ClaudeMonitorUITests
      # The hosted test app detects XCTest itself (`AppDelegate.isUnitTestHost`)
      # and skips its launch sequence, so no environment override is needed here.
  ClaudeMonitorMobile:
    build:
      targets:
        ClaudeMonitorMobile: all
        ClaudeMonitorMobileWidget: [build]
        ClaudeMonitorMobileTests: [test]
    test:
      targets:
        - ClaudeMonitorMobileTests
targets:
  ClaudeMonitor:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - path: App
      - path: scripts/hook.sh
        buildPhase: resources
      - path: scripts/codex-hook.sh
        buildPhase: resources
      - path: scripts/pi-extension.ts
        buildPhase: resources
      - path: scripts/offline-prowl.sh.template
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        LSUIElement: false
        # Track the build-setting versions so a MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # bump actually reaches the bundle (the static Info.plist otherwise pins these to
        # literals and the app keeps reporting 1.0/1). HookMaintenance also keys its
        # "refresh hooks on update" check on CFBundleVersion, so this must be live.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppleEventsUsageDescription: "Claude Monitor uses Apple events to focus the Terminal.app or iTerm2 tab of a selected Claude Code session."
        NSHumanReadableCopyright: "Copyright © 2026 Cliq Consulting LLC. All rights reserved."
        # actool emits `AppIcon.icns` into Contents/Resources but its generated partial
        # Info.plist isn't merged when `INFOPLIST_FILE` is a static path, so declare
        # the icon reference explicitly here. `CFBundleIconFile` is the legacy macOS
        # key (`.icns` filename without extension); `CFBundleIconName` is the modern
        # asset-catalog-aware key. Both point at the same name; Finder/Dock use them.
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        AppGroupIdentifier: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_NAME: ClaudeMonitor
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/ClaudeMonitor.entitlements
    dependencies:
      - target: ClaudeMonitorWidget
        embed: true
  ClaudeMonitorTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - path: Tests
      - path: scripts/hook.sh
        buildPhase: resources
      - path: scripts/codex-hook.sh
        buildPhase: resources
      - path: scripts/pi-extension.ts
        buildPhase: resources
      - path: scripts/offline-prowl.sh.template
        buildPhase: resources
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: ClaudeMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
  ClaudeMonitorIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - path: IntegrationTests
    dependencies:
      - target: ClaudeMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).integration-tests
  ClaudeMonitorUITests:
    type: bundle.ui-testing
    platform: macOS
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - path: UITests
    dependencies:
      - target: ClaudeMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ui-tests
  ClaudeMonitorWidget:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    sources:
      - path: Widget
      - path: App/Models/UsageModels.swift
      - path: App/Models/AgentProvider.swift
      - path: App/Models/RGB.swift
      - path: App/UI/UsagePalette.swift
      - path: App/Core/Usage/UsageFormatting.swift
      - path: App/Core/Usage/UsageSnapshotStore.swift
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Claude Usage
        AppGroupIdentifier: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        CODE_SIGN_ENTITLEMENTS: Widget/ClaudeMonitorWidget.entitlements
  # iPhone app: renders the usage panel from the Mac's LAN bridge
  # (UsageBridgeServer `/panel`), found over Bonjour or by address.
  ClaudeMonitorMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: Configuration/iOS.xcconfig
      Release: Configuration/iOS.xcconfig
    sources:
      - path: iOS
      - path: App/Models/UsageModels.swift
      - path: App/Models/AgentProvider.swift
      - path: App/Models/RGB.swift
      - path: App/UI/UsagePalette.swift
      - path: App/UI/UsageAccountRow.swift
      - path: App/Core/Usage/UsageFormatting.swift
      - path: App/Core/Usage/UsageSnapshotStore.swift
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Claude Monitor
        AppGroupIdentifier: $(IOS_APP_GROUP_ID)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Cliq Consulting LLC. All rights reserved."
        NSLocalNetworkUsageDescription: "Claude Monitor reads usage limits from the Claude Monitor app on your Mac over your local network."
        # Must match UsageBridgeServer.bonjourServiceType / BridgeEndpoint.serviceType.
        NSBonjourServices:
          - _claudemonitor._tcp
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: ClaudeMonitorMobile
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: iOS/ClaudeMonitorMobile.entitlements
    dependencies:
      - target: ClaudeMonitorMobileWidget
        embed: true
  # Home Screen widget. Reuses the Mac widget's view; fetches `/usage` (or
  # `/panel`, narrowed to the account picked in the app) from the Mac the app
  # selected (both choices shared through the App Group). Its up/down buttons
  # switch the picked account via an AppIntent.
  ClaudeMonitorMobileWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Configuration/iOS.xcconfig
      Release: Configuration/iOS.xcconfig
    sources:
      - path: iOSWidget
      - path: Widget/UsageWidgetView.swift
      - path: Widget/UsageEntry.swift
      - path: iOS/BridgeEndpoint.swift
      - path: iOS/BridgeClient.swift
      - path: App/Models/UsageModels.swift
      - path: App/Models/AgentProvider.swift
      - path: App/Models/RGB.swift
      - path: App/UI/UsagePalette.swift
      - path: App/Core/Usage/UsageFormatting.swift
      - path: App/Core/Usage/UsageSnapshotStore.swift
    info:
      path: iOSWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: Claude Usage
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AppGroupIdentifier: $(IOS_APP_GROUP_ID)
        NSLocalNetworkUsageDescription: "Claude Monitor reads usage limits from the Claude Monitor app on your Mac over your local network."
        NSBonjourServices:
          - _claudemonitor._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID).widget
        CODE_SIGN_ENTITLEMENTS: iOSWidget/ClaudeMonitorMobileWidget.entitlements
  ClaudeMonitorMobileTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Configuration/iOS.xcconfig
      Release: Configuration/iOS.xcconfig
    sources:
      - path: iOSTests
    dependencies:
      - target: ClaudeMonitorMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_APP_BUNDLE_ID).tests
